- title: "Reasoning as Compression: Unifying Budget Forcing via the Conditional Information Bottleneck"
  authors: "Fabio Valerio Massoli, Andrey Kuzmin, Arash Behboodi"
  venue: "NeurIPS"
  year: 2026
  selected: true
  image: /assets/img/pubs/cib.png
  topics: [Efficient reasoning, Information theory, RL]
  tldr: "Treats chain-of-thought as lossy compression. A conditional information bottleneck yields an RL objective that removes redundant reasoning tokens and keeps the ones that matter, with length penalties as a special case."
  links:
    arxiv: "https://arxiv.org/abs/2603.08462"
    neurips: "https://neurips.cc/virtual/2026/poster/148496"
