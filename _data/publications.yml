- title: "Memory-Efficient Looped Transformer: Decoupling Compute from Memory in Looped Language Models"
  authors: "Victor Conchello Vendrell, Arnau Padres Masdemont, Niccolò Grillo, Jordi Ros-Giralt, Arash Behboodi, Fabio Valerio Massoli"
  venue: "arXiv"
  year: 2026
  selected: true
  image: /assets/img/pubs/melt.png
  topics: [Looped LMs, Efficient reasoning]
  tldr: "Looped models trade parameters for compute, but their KV cache grows with every loop. Decoupling the two cuts the KV footprint of Ouro models by 4x (32 GB to 8 GB)."
